[package]
name = "nucleo-completion-module"
version = "0.1.20"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Rust dynamic module for nucleo-completion.el"

[lib]
crate-type = ["cdylib"]

[[test]]
name = "rustmigemo-boundaries"
path = "vendor/rustmigemo/tests/boundaries.rs"

[dependencies]
emacs = "0.21"
nucleo-matcher = "0.3"
regex = "=1.13.1"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym", "with_tone_num_end"] }
rustmigemo = { path = "vendor/rustmigemo", version = "0.1.7-dev.0" }

[profile.release]
codegen-units = 1
lto = "thin"
