name: prebuilt-modules

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to upload assets to, for example v0.1.16
        required: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate package versions
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          pkgid="$(cargo pkgid --package nucleo-completion-module)"
          version="${pkgid##*@}"
          if [[ -z "$version" || "$version" == "$pkgid" ]]; then
            echo "Could not determine package version from ${pkgid}" >&2
            exit 1
          fi
          expected_tag="v${version}"
          if [[ "$EVENT_NAME" == workflow_dispatch && "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${version}" >&2
            exit 1
          fi
          grep -F ";; Version: ${version}" nucleo-completion.el >/dev/null
          grep -F "(defconst nucleo-completion-required-module-version \"${version}\"" \
            nucleo-completion.el >/dev/null

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Build Rust module
        run: cargo build --release

      - name: Test Rust module
        run: cargo test --release

      - name: Lint Rust module
        run: cargo clippy --all-targets -- -D warnings

      - name: Byte compile Elisp
        run: emacs -Q --batch -L . -L target/release --eval '(setq byte-compile-error-on-warn t)' --eval '(byte-compile-file "nucleo-completion.el")'

      - name: Check Elisp documentation
        run: emacs -Q --batch -L . --eval '(progn (require (quote checkdoc)) (unless (checkdoc-file "nucleo-completion.el") (kill-emacs 1)))'

      - name: Check Elisp declarations
        run: emacs -Q --batch -L . --eval '(when (check-declare-file "nucleo-completion.el") (kill-emacs 1))'

      - name: Run ERT
        run: emacs -Q --batch -L . -L target/release -L test -l test/nucleo-completion-tests.el -f ert-run-tests-batch-and-exit

  build:
    name: ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            library: libnucleo_completion_module.so
            extension: so
          - os: macos-15-intel
            target: x86_64-apple-darwin
            library: libnucleo_completion_module.dylib
            extension: dylib
          - os: macos-15
            target: aarch64-apple-darwin
            library: libnucleo_completion_module.dylib
            extension: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            library: nucleo_completion_module.dll
            extension: dll

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build module
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install Emacs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Install Emacs (macOS)
        if: runner.os == 'macOS'
        run: brew install emacs

      - name: Install Emacs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install emacs -y --no-progress

      - name: Verify module loads (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          emacs -Q --batch \
            -L . \
            -L "target/${{ matrix.target }}/release" \
            -l nucleo-completion.el \
            --eval '(progn
                      (unless (featurep (quote nucleo-completion-module))
                        (error "nucleo-completion module did not load"))
                      (unless (string= (nucleo-completion-module-version)
                                       nucleo-completion-required-module-version)
                        (error "loaded module version mismatch"))
                      (unless (equal (car (nucleo-completion-candidates
                                           "fb" (list "fb" "foo-baz" "bar")
                                           nil nil nil 0 nil))
                                     (list "fb" "foo-baz"))
                        (error "loaded module did not score candidates"))
                      (dolist (case (quote ((nucleo-completion-migemo-regexp "kensaku" "検索")
                                            (nucleo-completion-pinyin-regexp "zhongguo" "中国")
                                            (nucleo-completion-hangul-regexp "ㄱㅅ" "감사"))))
                        (unless (string-match-p (funcall (car case) (cadr case)) (caddr case))
                          (error "loaded module language search failed: %S" case)))
                      (unless (equal (nth 3 (nucleo-completion-candidates-with-regexp-groups
                                             "nihon" (list "日本") nil nil nil nil 0 nil
                                             (list (list "日本"))))
                                     (list "日本"))
                        (error "loaded module combined language scan failed")))'

      - name: Verify module loads (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $emacs = (Get-Command emacs -ErrorAction SilentlyContinue).Source
          if (-not $emacs) {
            $emacs = Get-ChildItem "$env:ProgramFiles\Emacs" -Recurse -Filter emacs.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $emacs) {
            $emacs = Get-ChildItem "$env:ChocolateyInstall\lib" -Recurse -Filter emacs.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $emacs) {
            throw "emacs.exe not found"
          }
          $eval = @'
          (progn
            (unless (featurep (quote nucleo-completion-module))
              (error "nucleo-completion module did not load"))
            (unless (string= (nucleo-completion-module-version)
                             nucleo-completion-required-module-version)
              (error "loaded module version mismatch"))
            (unless (equal (car (nucleo-completion-candidates
                                 "fb" (list "fb" "foo-baz" "bar")
                                 nil nil nil 0 nil))
                           (list "fb" "foo-baz"))
              (error "loaded module did not score candidates"))
            (dolist (case (quote ((nucleo-completion-migemo-regexp "kensaku" "検索")
                                  (nucleo-completion-pinyin-regexp "zhongguo" "中国")
                                  (nucleo-completion-hangul-regexp "ㄱㅅ" "감사"))))
              (unless (string-match-p (funcall (car case) (cadr case)) (caddr case))
                (error "loaded module language search failed: %S" case)))
            (unless (equal (nth 3 (nucleo-completion-candidates-with-regexp-groups
                                   "nihon" (list "日本") nil nil nil nil 0 nil
                                   (list (list "日本"))))
                           (list "日本"))
              (error "loaded module combined language scan failed")))
          '@
          & $emacs -Q --batch `
            -L . `
            -L "target/${{ matrix.target }}/release" `
            -l nucleo-completion.el `
            --eval $eval

      - name: Stage module
        shell: bash
        run: |
          set -euo pipefail
          asset="nucleo-completion-module-${{ matrix.target }}.${{ matrix.extension }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.library }} \
            "dist/${asset}"
          cat THIRD-PARTY-NOTICES LICENSE LICENSES/* > "dist/${asset}.licenses.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${asset}" > "dist/${asset}.sha256"
          else
            shasum -a 256 "dist/${asset}" > "dist/${asset}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-completion-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-release-assets:
    name: publish-release-assets
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nucleo-completion-*
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          # Refuse to attach binaries to a tag that names another commit.
          check_tag_commit() {
            local status=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || status=$?
            if [[ "$status" == 2 ]]; then
              return 1
            elif [[ "$status" != 0 ]]; then
              echo "Could not inspect remote tag $tag" >&2
              exit "$status"
            fi
            git fetch --no-tags origin "refs/tags/$tag" || exit $?
            local tag_commit
            tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')" || exit $?
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag points to $tag_commit, not built commit $GITHUB_SHA" >&2
              exit 1
            fi
          }
          check_tag_commit || true
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Prebuilt nucleo-completion dynamic modules for $tag."
          fi
          if ! check_tag_commit; then
            echo "Release tag $tag does not exist after release creation" >&2
            exit 1
          fi
          gh release upload "$tag" artifacts/* --clobber
